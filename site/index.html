<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Newsstand</title>
    <meta name="description" content="Your news, reviews, trends and sport in one scrolling feed." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-row">
        <a class="brand" href="#" aria-label="Newsstand home">
          <img src="icon.svg" alt="" width="28" height="28" />
          <span>Newsstand</span>
        </a>
        <div class="topbar-actions">
          <span class="updated" id="updated"></span>
          <button class="icon-btn" id="refresh-btn" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
          <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.31-.09.63-.09.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
          </button>
        </div>
      </div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
    </header>

    <main id="main">
      <div class="chips" id="chips"></div>
      <div id="view"></div>
      <div id="sentinel" aria-hidden="true"></div>
    </main>

    <!-- Reader view -->
    <section class="reader" id="reader" hidden aria-modal="true" role="dialog" aria-label="Article">
      <div class="reader-bar">
        <button class="icon-btn" id="reader-back" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <span class="reader-source" id="reader-source"></span>
        <div class="reader-actions">
          <button class="pill-btn tldr-btn" id="tldr-btn" title="Summarise this article on your device">
            <svg viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg>
            TL;DR
          </button>
          <button class="icon-btn" id="font-btn" title="Text size" aria-label="Text size">
            <svg viewBox="0 0 24 24"><path d="M9 4v3h5v12h3V7h5V4H9zm-6 8h3v7h3v-7h3V9H3v3z"/></svg>
          </button>
          <a class="icon-btn" id="reader-open" target="_blank" rel="noopener noreferrer" title="Open original" aria-label="Open original">
            <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
          </a>
        </div>
      </div>
      <div class="reader-scroll" id="reader-scroll">
        <article class="reader-article" id="reader-article"></article>
      </div>
    </section>

    <!-- Settings sheet -->
    <dialog class="sheet" id="settings">
      <form method="dialog" class="sheet-inner">
        <div class="sheet-head">
          <h2>Settings</h2>
          <button class="icon-btn" value="close" aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <section>
          <h3>Sport &amp; spoilers</h3>
          <div class="segmented" id="sport-mode" role="radiogroup">
            <label><input type="radio" name="sport" value="show" /> <span>Show</span></label>
            <label><input type="radio" name="sport" value="shield" /> <span>Spoiler shield</span></label>
            <label><input type="radio" name="sport" value="hide" /> <span>Hide</span></label>
          </div>
          <p class="hint">Spoiler shield blurs sport headlines and pictures until you tap one. Hide removes the Sport tab completely.</p>
        </section>
        <section>
          <h3>Sources</h3>
          <div id="source-toggles" class="toggles"></div>
        </section>
        <section>
          <h3>TL;DR summaries</h3>
          <div class="segmented" id="tldr-mode" role="radiogroup">
            <label><input type="radio" name="tldr" value="quick" /> <span>Quick</span></label>
            <label><input type="radio" name="tldr" value="ai" /> <span>On-device AI</span></label>
          </div>
          <p class="hint" id="tldr-hint"></p>
          <button type="button" class="text-btn" id="clear-model">Delete downloaded AI model</button>
        </section>
        <section>
          <h3>Appearance</h3>
          <div class="segmented" id="theme-mode" role="radiogroup">
            <label><input type="radio" name="theme" value="auto" /> <span>Auto</span></label>
            <label><input type="radio" name="theme" value="light" /> <span>Light</span></label>
            <label><input type="radio" name="theme" value="dark" /> <span>Dark</span></label>
          </div>
        </section>
        <p class="hint" id="source-status"></p>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
